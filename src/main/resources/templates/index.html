<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Java</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .app-logo {
            width: 50px; height: 50px; background: #e74c3c; /* Rojo Java */
            color: white; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; margin-right: 15px;
        }
        .note-card { cursor: grab; transition: all 0.2s; }
        .note-card:active { cursor: grabbing; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .tag-badge { cursor: pointer; }
    </style>
</head>
<body class="bg-dark">

<div class="container py-5">
    <div class="d-flex align-items-center mb-4">
        <div class="app-logo">N</div>
        <h1 class="h3 mb-0">Mis Notas (Java Spring)</h1>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form id="addForm" autocomplete="off">
                <div class="mb-2">
                    <textarea class="form-control" name="content" placeholder="Escribe algo..." required></textarea>
                </div>
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="date" class="form-control" name="createdAt" th:value="${today}">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="tags" placeholder="Etiquetas (sep. por comas)">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Añadir</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="mb-3" id="filters">
        <span class="me-2 text-muted">Filtrar:</span>
        <button class="btn btn-sm btn-outline-secondary active filter-btn" data-tag="all">Todas</button>
        <th:block th:each="tag : ${allTags}">
            <button class="btn btn-sm btn-outline-secondary filter-btn" th:data-tag="${tag}" th:text="${tag}"></button>
        </th:block>
    </div>

    <div id="notesList" class="row g-3">
        <div th:each="note : ${notes}" class="col-12 note-item" 
             th:data-id="${note.id}" 
             th:data-tags="${note.tags != null ? note.tags.toLowerCase() : ''}">
            
            <div class="card note-card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <small class="text-muted date-display" th:text="${note.createdAt}"></small>
                        <div>
                            <button class="btn btn-sm btn-link text-decoration-none p-0 me-2 btn-edit">✏️</button>
                            <button class="btn btn-sm btn-link text-decoration-none p-0 text-danger btn-delete">🗑️</button>
                        </div>
                    </div>
                    <p class="mb-2 content-display" style="white-space: pre-wrap;" th:text="${note.content}"></p>
                    
                    <div class="tags-display">
                        <th:block th:if="${note.tags != null}" th:each="t : ${note.tags.split(',')}">
                            <span class="badge bg-secondary tag-badge me-1" th:if="${!t.trim().isEmpty()}" th:text="${t.trim()}"></span>
                        </th:block>
                    </div>

                    <form class="edit-form d-none mt-2">
                        <input type="hidden" name="id" th:value="${note.id}">
                        <input type="hidden" name="action" value="update">
                        <textarea class="form-control mb-1" name="content" th:text="${note.content}"></textarea>
                        <input type="date" class="form-control mb-1" name="createdAt" th:value="${note.createdAt}">
                        <input type="text" class="form-control mb-1" name="tags" th:value="${note.tags}">
                        <button type="submit" class="btn btn-success btn-sm">Guardar</button>
                        <button type="button" class="btn btn-secondary btn-sm btn-cancel">Cancelar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script>
    // El Javascript es 99% igual, solo ajustamos los nombres de los campos (createdAt)
    
    // 1. Drag & Drop
    const notesList = document.getElementById('notesList');
    new Sortable(notesList, {
        animation: 150,
        onEnd: function () {
            let order = [];
            document.querySelectorAll('.note-item').forEach((el, index) => {
                order.push({id: el.getAttribute('data-id'), position: index});
            });
            fetch('/api', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'reorder', order: order})
            });
        }
    });

    // 2. Añadir
    document.getElementById('addForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new URLSearchParams(new FormData(this));
        formData.append('action', 'create');
        const form = this;
        
        fetch('/api', { 
            method: 'POST', 
            body: formData,
            headers: {'Content-Type': 'application/x-www-form-urlencoded'}
        }).then(() => {
            form.reset();
            location.reload();
        });
    });

    // 3. Borrar y Editar
    notesList.addEventListener('click', function(e) {
        const card = e.target.closest('.note-item');
        if (e.target.classList.contains('btn-delete')) {
            if(confirm('¿Borrar nota?')) {
                const formData = new URLSearchParams();
                formData.append('action', 'delete');
                formData.append('id', card.getAttribute('data-id'));
                fetch('/api', { 
                    method: 'POST', 
                    body: formData,
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
                }).then(() => card.remove());
            }
        }
        // ... (Lógica de mostrar/ocultar form editar es idéntica a las anteriores)
        if (e.target.classList.contains('btn-edit')) {
            card.querySelector('.content-display').classList.add('d-none');
            card.querySelector('.tags-display').classList.add('d-none');
            card.querySelector('.date-display').classList.add('d-none');
            card.querySelector('.edit-form').classList.remove('d-none');
        }
        if (e.target.classList.contains('btn-cancel')) {
            card.querySelector('.content-display').classList.remove('d-none');
            card.querySelector('.tags-display').classList.remove('d-none');
            card.querySelector('.date-display').classList.remove('d-none');
            card.querySelector('.edit-form').classList.add('d-none');
        }
    });

    // 4. Guardar Edición
    document.addEventListener('submit', function(e) {
        if(e.target.classList.contains('edit-form')) {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));
            fetch('/api', { 
                method: 'POST', 
                body: formData,
                headers: {'Content-Type': 'application/x-www-form-urlencoded'}
            }).then(() => location.reload());
        }
    });

    // 5. Filtros
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tag = btn.getAttribute('data-tag');
            document.querySelectorAll('.note-item').forEach(item => {
                const itemTags = item.getAttribute('data-tags');
                if (tag === 'all' || itemTags.includes(tag.toLowerCase())) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
</script>
</body>
</html>
